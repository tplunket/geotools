<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Globe base -->
  <circle cx="16" cy="16" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="1.5"/>
  
  <!-- Globe landmasses (continents) -->
  <path d="M7 11 Q11 9, 16 11 Q21 13, 25 11" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
  <path d="M5 16 Q10 18, 16 16 Q22 14, 27 16" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
  <path d="M7 21 Q11 23, 16 21 Q21 19, 25 21" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Meridian lines -->
  <ellipse cx="16" cy="16" rx="12" ry="5" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="16" cy="16" rx="6" ry="12" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Hammer handle (dark brown, 45 degree angle) -->
  <line x1="8" y1="8" x2="24" y2="24" stroke="#654321" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Hammer head (silver/light gray) -->
  <rect x="22" y="20" width="8" height="4" fill="#d1d5db" stroke="#9ca3af" stroke-width="0.5" rx="1" transform="rotate(45 26 22)"/>
  
  <!-- Impact sparks -->
  <circle cx="18" cy="18" r="1.5" fill="#fbbf24"/>
  <circle cx="20" cy="16" r="1" fill="#f59e0b"/>
  <circle cx="16" cy="20" r="1" fill="#f59e0b"/>
</svg>